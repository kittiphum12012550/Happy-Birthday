<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สุขสันต์วันเกิด!</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600&family=Prompt:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Kanit', sans-serif;
            margin: 0;
            overflow-x: hidden; /* Prevent horizontal scrolling on mobile */
            min-height: 100vh; /* Ensure full height on mobile browsers */
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
        }

        h1 {
            font-family: 'Prompt', sans-serif;
            text-shadow: 2px 4px 6px rgba(0,0,0,0.1);
        }

        .main-container {
            width: 90%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .floating {
            animation: floating 3s ease-in-out infinite;
        }

        .pulse-hover:hover {
            animation: pulse 1s infinite;
        }

        @keyframes floating {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        /* Glassmorphism Effect */
        .glass-card {
            background: rgba(255, 255, 255, 0.35);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.2);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        /* Modal Overlay to ensure perfect centering on mobile */
        #message-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 50;
            pointer-events: none; /* Let clicks pass through when hidden */
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        #message-overlay.show {
            pointer-events: auto;
            opacity: 1;
        }

        #message-card {
            width: 90%;
            max-width: 400px;
            transform: translateY(30px) scale(0.95);
            transition: all 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        #message-overlay.show #message-card {
            transform: translateY(0) scale(1);
        }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- Header -->
        <h1 class="text-5xl md:text-6xl text-white mb-6 animate-bounce" style="animation-duration: 2s;">
            สุขสันต์วันเกิด!
        </h1>

        <!-- Cake Visual -->
        <div class="text-8xl md:text-9xl mb-8 floating cursor-default select-none">
            🎂
        </div>

        <!-- Interactive Gift Box -->
        <div id="gift-container" class="flex flex-col items-center justify-center cursor-pointer pulse-hover transition-transform duration-300">
            <div id="gift-icon" class="text-7xl md:text-8xl select-none transition-transform duration-300 transform hover:scale-110">
                🎁
            </div>
            <p id="gift-text" class="text-pink-600 font-bold mt-4 bg-white/50 px-5 py-2 rounded-full shadow-sm text-lg backdrop-blur-sm border border-white/50">
                แตะที่กล่องของขวัญสิ! 🎁
            </p>
        </div>
    </div>

    <!-- Hidden Personalized Message (Perfectly Centered Overlay) -->
    <div id="message-overlay" class="hidden">
        <div id="message-card" class="p-8 glass-card text-gray-800 text-center">
            <h2 class="text-3xl font-bold text-pink-600 mb-4" style="font-family: 'Prompt', sans-serif;">เซอร์ไพรส์! 🎉</h2>
            <p class="text-xl leading-relaxed mb-8 font-medium text-gray-800">
                ขอให้มีความสุขมากๆ คิดสิ่งใดขอให้สมปรารถนา สุขภาพร่างกายแข็งแรงนะ!
            </p>
            <button id="close-btn" class="bg-pink-500 hover:bg-pink-600 text-white font-bold py-3 px-8 rounded-full transition-all duration-300 shadow-lg text-lg transform hover:scale-105 active:scale-95">
                รับพร!
            </button>
        </div>
    </div>

    <script>
        const giftContainer = document.getElementById('gift-container');
        const giftIcon = document.getElementById('gift-icon');
        const giftText = document.getElementById('gift-text');
        const messageOverlay = document.getElementById('message-overlay');
        const closeBtn = document.getElementById('close-btn');

        // Function to shoot confetti optimized for mobile screens
        function shootConfetti() {
            var duration = 3 * 1000;
            var animationEnd = Date.now() + duration;
            var defaults = { startVelocity: 25, spread: 360, ticks: 60, zIndex: 100 };

            function randomInRange(min, max) {
                return Math.random() * (max - min) + min;
            }

            var interval = setInterval(function() {
                var timeLeft = animationEnd - Date.now();

                if (timeLeft <= 0) {
                    return clearInterval(interval);
                }

                var particleCount = 40 * (timeLeft / duration);
                
                // Shoot from left and right edges
                confetti(Object.assign({}, defaults, { 
                    particleCount,
                    origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 }
                }));
                confetti(Object.assign({}, defaults, { 
                    particleCount,
                    origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 }
                }));
            }, 250);
        }

        // Handle Gift Click
        giftContainer.addEventListener('click', () => {
            giftIcon.innerText = '🎉';
            giftIcon.classList.remove('hover:scale-110');
            giftContainer.classList.remove('pulse-hover', 'cursor-pointer');
            giftText.style.opacity = '0';
            
            // Trigger Confetti
            shootConfetti();

            // Show Message Card
            setTimeout(() => {
                messageOverlay.classList.remove('hidden');
                // Trigger reflow
                void messageOverlay.offsetWidth;
                messageOverlay.classList.add('show');
            }, 400);
        });

        // Handle Close Button
        closeBtn.addEventListener('click', () => {
            messageOverlay.classList.remove('show');
            setTimeout(() => {
                messageOverlay.classList.add('hidden');
                // Reset gift box
                giftIcon.innerText = '🎁';
                giftContainer.classList.add('pulse-hover', 'cursor-pointer');
                giftText.style.opacity = '1';
                giftIcon.classList.add('hover:scale-110');
            }, 500); 
        });
    </script>
</body>
</html>
