<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สุขสันต์วันเกิด!</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600&family=Prompt:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Kanit', sans-serif;
            margin: 0;
            overflow: hidden; /* Prevent scrollbars from confetti */
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        h1 {
            font-family: 'Prompt', sans-serif;
            text-shadow: 2px 4px 6px rgba(0,0,0,0.1);
        }

        .floating {
            animation: floating 3s ease-in-out infinite;
        }

        .pulse-hover:hover {
            animation: pulse 1s infinite;
        }

        @keyframes floating {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.25);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.18);
        }

        #message-card {
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        #message-card.show {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <div class="relative w-full max-w-2xl px-4 flex flex-col items-center justify-center text-center z-10">
        
        <!-- Header -->
        <h1 class="text-5xl md:text-7xl text-white mb-6 animate-bounce" style="animation-duration: 2s;">
            สุขสันต์วันเกิด!
        </h1>

        <!-- Cake Visual -->
        <div class="text-8xl md:text-9xl mb-8 floating cursor-default select-none">
            🎂
        </div>

        <!-- Interactive Gift Box -->
        <div id="gift-container" class="flex flex-col items-center justify-center cursor-pointer pulse-hover transition-transform duration-300">
            <div id="gift-icon" class="text-7xl md:text-8xl select-none transition-transform duration-300 transform hover:scale-110">
                🎁
            </div>
            <p id="gift-text" class="text-white font-bold mt-4 bg-white/30 px-4 py-2 rounded-full shadow-sm text-lg md:text-xl">
                คลิกที่กล่องของขวัญสิ! 🎁
            </p>
        </div>

        <!-- Hidden Personalized Message -->
        <div id="message-card" class="hidden absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-11/12 max-w-md p-8 glass-card text-gray-800">
            <h2 class="text-3xl font-bold text-pink-500 mb-4" style="font-family: 'Prompt', sans-serif;">เซอร์ไพรส์! 🎉</h2>
            <p class="text-xl leading-relaxed mb-6 font-semibold">
                ขอให้มีความสุขมากๆ สุขภาพร่างกายแข็งแรง คิดสิ่งใดก็ขอให้สมปรารถนา และมีแต่รอยยิ้มในทุกๆ วันนะ 🎂✨
            </p>
            <button id="close-btn" class="bg-pink-500 hover:bg-pink-600 text-white font-bold py-2 px-6 rounded-full transition-colors shadow-md text-lg">
                รับพร!
            </button>
        </div>

    </div>

    <script>
        const giftContainer = document.getElementById('gift-container');
        const giftIcon = document.getElementById('gift-icon');
        const giftText = document.getElementById('gift-text');
        const messageCard = document.getElementById('message-card');
        const closeBtn = document.getElementById('close-btn');

        // Function to shoot confetti
        function shootConfetti() {
            var duration = 3 * 1000;
            var animationEnd = Date.now() + duration;
            var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0 };

            function randomInRange(min, max) {
                return Math.random() * (max - min) + min;
            }

            var interval = setInterval(function() {
                var timeLeft = animationEnd - Date.now();

                if (timeLeft <= 0) {
                    return clearInterval(interval);
                }

                var particleCount = 50 * (timeLeft / duration);
                confetti(Object.assign({}, defaults, { particleCount,
                    origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 }
                }));
                confetti(Object.assign({}, defaults, { particleCount,
                    origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 }
                }));
            }, 250);
        }

        // Handle Gift Click
        giftContainer.addEventListener('click', () => {
            // Change gift icon to open box or party popper
            giftIcon.innerText = '🎉';
            giftIcon.classList.remove('hover:scale-110');
            giftContainer.classList.remove('pulse-hover', 'cursor-pointer');
            giftText.style.opacity = '0';
            
            // Trigger Confetti
            shootConfetti();

            // Show Message Card
            setTimeout(() => {
                messageCard.classList.remove('hidden');
                // Trigger reflow to restart animation
                void messageCard.offsetWidth;
                messageCard.classList.add('show');
            }, 300);
        });

        // Handle Close Button
        closeBtn.addEventListener('click', () => {
            messageCard.classList.remove('show');
            setTimeout(() => {
                messageCard.classList.add('hidden');
                // Reset gift box so they can click again if they want
                giftIcon.innerText = '🎁';
                giftContainer.classList.add('pulse-hover', 'cursor-pointer');
                giftText.style.opacity = '1';
                giftIcon.classList.add('hover:scale-110');
            }, 500); // Wait for transition to finish
        });
    </script>
</body>
</html>
