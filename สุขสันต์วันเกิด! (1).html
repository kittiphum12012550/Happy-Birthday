<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>สุขสันต์วันเกิด!</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600&family=Prompt:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#e9d8ff; --bg2:#f8d4ee; --ink:#4b2a7b; --accent:#ff7ab8; --deep:#7c4dcc;
  --card:rgba(255,255,255,.55); --chip:rgba(255,255,255,.7); --line:rgba(255,255,255,.7);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg1:#2a1745; --bg2:#4a2160; --ink:#f3e8ff; --accent:#ff8cc6; --deep:#c4a1ff;
    --card:rgba(40,20,70,.6); --chip:rgba(40,20,70,.7); --line:rgba(255,255,255,.2);
  }
}
:root[data-theme="dark"]{
  --bg1:#2a1745; --bg2:#4a2160; --ink:#f3e8ff; --accent:#ff8cc6; --deep:#c4a1ff;
  --card:rgba(40,20,70,.6); --chip:rgba(40,20,70,.7); --line:rgba(255,255,255,.2);
}
html{height:100%}
body{
  font-family:'Kanit',sans-serif; margin:0; min-height:100%; overflow-x:hidden;
  background:var(--bg1);
  background-image:
    radial-gradient(circle at 20% 15%, rgba(255,255,255,.55) 0, transparent 35%),
    radial-gradient(circle at 85% 80%, var(--bg2) 0, transparent 45%),
    linear-gradient(160deg,var(--bg1),var(--bg2));
  background-attachment:fixed;
  display:flex; flex-direction:column; justify-content:center; align-items:center;
  text-align:center; color:var(--ink); position:relative;
}
h1{font-family:'Prompt',sans-serif; color:var(--deep); text-shadow:0 3px 0 #fff, 0 6px 14px rgba(124,77,204,.3);}
.main{width:90%; max-width:500px; display:flex; flex-direction:column; align-items:center; z-index:10; padding:24px 0;}
.floating{animation:floating 3s ease-in-out infinite}
.pulse-hover:hover{animation:pulse 1s infinite}
@keyframes floating{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes drift{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-18px) rotate(8deg)}}
.deco{position:fixed; z-index:1; font-size:1.7rem; opacity:.75; animation:drift 5s ease-in-out infinite; pointer-events:none; user-select:none}
.glass{background:var(--card); box-shadow:0 8px 32px rgba(124,77,204,.25); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border-radius:28px; border:2px solid var(--line);}
.ears{display:flex; gap:7.5rem; font-size:2.6rem; margin-bottom:-1.1rem; filter:drop-shadow(0 3px 4px rgba(75,42,123,.3))}
.cakewrap{background:var(--chip); border:3px dashed var(--accent); border-radius:9999px; padding:.6rem 1.8rem}
.giftchip{color:var(--accent); background:var(--chip); border:2px solid var(--line); box-shadow:0 4px 14px rgba(255,122,184,.3);}
#message-overlay{position:fixed; inset:0; display:flex; justify-content:center; align-items:center; z-index:50; pointer-events:none; opacity:0; transition:opacity .5s ease; background:rgba(124,77,204,.12)}
#message-overlay.show{pointer-events:auto; opacity:1}
#message-card{width:90%; max-width:400px; transform:translateY(30px) scale(.95); transition:all .6s cubic-bezier(.68,-.55,.265,1.55)}
#message-overlay.show #message-card{transform:none}
#close-btn{background:linear-gradient(135deg,var(--accent),var(--deep)); box-shadow:0 6px 16px rgba(124,77,204,.4)}
</style>
</head>
<body>
<span class="deco" style="top:8%;left:8%">💜</span>
<span class="deco" style="top:14%;right:10%;animation-delay:-1s">🎀</span>
<span class="deco" style="top:46%;left:5%;animation-delay:-2s">🦇</span>
<span class="deco" style="top:58%;right:6%;animation-delay:-3s">⭐</span>
<span class="deco" style="bottom:10%;left:12%;animation-delay:-1.5s">🖤</span>
<span class="deco" style="bottom:8%;right:14%;animation-delay:-2.5s">💀</span>

<div class="main">
  <div class="ears" aria-hidden="true"><span>🦇</span><span>🦇</span></div>
  <h1 class="text-5xl md:text-6xl mb-5 animate-bounce" style="animation-duration:2s">สุขสันต์วันเกิด!</h1>

  <div class="cakewrap mb-6">
    <div class="text-8xl md:text-9xl floating select-none">🎂</div>
  </div>

  <div id="gift-container" class="flex flex-col items-center cursor-pointer pulse-hover">
    <div id="gift-icon" class="text-7xl md:text-8xl select-none transition-transform duration-300 hover:scale-110">🎁</div>
    <p id="gift-text" class="giftchip font-semibold mt-4 px-5 py-2 rounded-full text-lg">แตะที่กล่องของขวัญสิ! 💜</p>
  </div>
</div>

<div id="message-overlay" class="hidden">
  <div id="message-card" class="p-8 glass text-center">
    <div class="text-4xl mb-2">🎀💜🎀</div>
    <h2 class="text-3xl font-bold mb-4" style="font-family:'Prompt',sans-serif;color:var(--accent)">เซอร์ไพรส์! 🎉</h2>
    <p class="text-xl leading-relaxed mb-8 font-medium">
      ขอให้มีความสุขมากๆ คิดสิ่งใดขอให้สมปรารถนา สุขภาพร่างกายแข็งแรงนะ!
    </p>
    <button id="close-btn" class="text-white font-bold py-3 px-8 rounded-full transition-all duration-300 text-lg hover:scale-105 active:scale-95">
      รับพร! 💜
    </button>
  </div>
</div>

<script>
const giftContainer=document.getElementById('gift-container');
const giftIcon=document.getElementById('gift-icon');
const giftText=document.getElementById('gift-text');
const overlay=document.getElementById('message-overlay');
const closeBtn=document.getElementById('close-btn');
const colors=['#c4a1ff','#e9d8ff','#ff8cc6','#f8d4ee','#7c4dcc','#ffffff'];

function shootConfetti(){
  const duration=3000, end=Date.now()+duration;
  const defaults={startVelocity:25,spread:360,ticks:60,zIndex:100,colors};
  const r=(a,b)=>Math.random()*(b-a)+a;
  const iv=setInterval(()=>{
    const left=end-Date.now();
    if(left<=0) return clearInterval(iv);
    const n=40*(left/duration);
    confetti({...defaults,particleCount:n,origin:{x:r(.1,.3),y:Math.random()-.2}});
    confetti({...defaults,particleCount:n,origin:{x:r(.7,.9),y:Math.random()-.2}});
  },250);
}

giftContainer.addEventListener('click',()=>{
  giftIcon.innerText='🎉';
  giftContainer.classList.remove('pulse-hover','cursor-pointer');
  giftText.style.opacity='0';
  shootConfetti();
  setTimeout(()=>{
    overlay.classList.remove('hidden');
    void overlay.offsetWidth;
    overlay.classList.add('show');
  },400);
});

closeBtn.addEventListener('click',()=>{
  overlay.classList.remove('show');
  setTimeout(()=>{
    overlay.classList.add('hidden');
    giftIcon.innerText='🎁';
    giftContainer.classList.add('pulse-hover','cursor-pointer');
    giftText.style.opacity='1';
  },500);
});
</script>
</body>
</html>
